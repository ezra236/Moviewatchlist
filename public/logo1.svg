<!--?xml version="1.0" encoding="UTF-8"?-->
<svg width="640" height="200" viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Watchlist app logo with wordmark">
  <title>Watchlist App Logo — Wordmark</title>
  <desc>Icon with play and checkmark plus the word Watchlist</desc>
  <defs>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.15"></feDropShadow>
    </filter>
  </defs>
  <g transform="translate(16,16)">
    <rect x="0" y="0" width="168" height="168" rx="32" fill="#4FC3F7" filter="url(#softShadow)"></rect>
    <path d="M70 58 L118 84 L70 110 Z" fill="white" opacity="0.95"></path>
    <path d="M56 122 q8 8 16 16 q22 -22 40 -46" fill="none" stroke="white" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"></path>
  </g>
  <g transform="translate(208,56)">
    <text x="0" y="36" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-weight="700" font-size="44" fill="#0B3954">Watch</text>
    <text x="180" y="36" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-weight="700" font-size="44" fill="#4FC3F7">list</text>
    <text x="0" y="78" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-weight="400" font-size="18" fill="#093047" opacity="0.85" letter-spacing="0.5">movies • shows • queue</text>
  </g>
</svg>
